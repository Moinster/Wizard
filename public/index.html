<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#151120">
<title>Wizard Scorekeeper</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800;900&family=Fraunces:opsz,wght@9..144,600;9..144,800&display=swap">
<style>
:root{
  --bg:#F1EFF6; --bg-deep:#E4DFEE; --surface:#FFFFFF; --surface-2:#F8F5FC;
  --line:#DBD4E8; --line-strong:#C4B9D8;
  --ink:#171220; --ink-2:#554B67; --ink-3:#8B81A1;
  --accent:#6B3FA0; --accent-ink:#FFFFFF; --accent-soft:#EEE5F9;
  --gold:#9A6407; --gold-soft:#FAEFD6;
  --good:#1B7A57; --good-soft:#DCF2E8;
  --bad:#B0382C; --bad-soft:#FBE4E1; --heart:#B0382C;
  --shadow-sm:0 1px 2px rgba(23,18,32,.07);
  --shadow-md:0 2px 4px rgba(23,18,32,.06), 0 14px 30px -18px rgba(23,18,32,.45);
  --radius:14px; --tap:48px;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#151120; --bg-deep:#0C0912; --surface:#1F1930; --surface-2:#271F3A;
  --line:#352C4B; --line-strong:#4A3E65;
  --ink:#F3EFFB; --ink-2:#B7AECB; --ink-3:#847A9C;
  --accent:#AC80EC; --accent-ink:#1A1026; --accent-soft:#2D2244;
  --gold:#F2B44A; --gold-soft:#39280B;
  --good:#4BCB9E; --good-soft:#123328;
  --bad:#FF7E71; --bad-soft:#3A1A17; --heart:#FF7E71;
  --shadow-sm:0 1px 2px rgba(0,0,0,.45);
  --shadow-md:0 2px 4px rgba(0,0,0,.4), 0 18px 36px -20px rgba(0,0,0,.9);
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#151120; --bg-deep:#0C0912; --surface:#1F1930; --surface-2:#271F3A;
  --line:#352C4B; --line-strong:#4A3E65;
  --ink:#F3EFFB; --ink-2:#B7AECB; --ink-3:#847A9C;
  --accent:#AC80EC; --accent-ink:#1A1026; --accent-soft:#2D2244;
  --gold:#F2B44A; --gold-soft:#39280B;
  --good:#4BCB9E; --good-soft:#123328;
  --bad:#FF7E71; --bad-soft:#3A1A17; --heart:#FF7E71;
  --shadow-sm:0 1px 2px rgba(0,0,0,.45);
  --shadow-md:0 2px 4px rgba(0,0,0,.4), 0 18px 36px -20px rgba(0,0,0,.9);
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;background:var(--bg);color:var(--ink);
  font-family:"Archivo","Helvetica Neue",Arial,sans-serif;font-size:16px;line-height:1.45;
  -webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent;
  padding-top:env(safe-area-inset-top,0px);
}
button,input{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:8px}
h1,h2,h3{margin:0;text-wrap:balance}
.num{font-variant-numeric:tabular-nums;font-feature-settings:"tnum" 1}
.app{min-height:100%;display:flex;flex-direction:column;max-width:760px;margin-inline:auto;padding-inline:16px}

.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;display:flex;align-items:center;gap:10px;
  padding-block:12px 10px;flex-wrap:nowrap;background:linear-gradient(var(--bg) 72%, transparent)}
.brand{display:flex;align-items:baseline;gap:8px;margin-right:auto;min-width:0;overflow:hidden}
.brand svg{width:22px;height:22px;flex:none;align-self:center;color:var(--accent)}
.brand h1{font-family:"Fraunces",Georgia,serif;font-weight:800;font-size:1.2rem;letter-spacing:-.01em}
.brand .sub{font-size:.62rem;text-transform:uppercase;letter-spacing:.16em;color:var(--ink-3);font-weight:700;white-space:nowrap}
.topbar-actions{display:flex;gap:6px;flex:none}
.icon-btn{height:38px;padding:0 11px;border-radius:999px;flex:none;border:1px solid var(--line);
  background:var(--surface);color:var(--ink-2);font-size:.78rem;font-weight:700;
  display:inline-flex;align-items:center;gap:6px;box-shadow:var(--shadow-sm)}
.icon-btn:hover{border-color:var(--line-strong);color:var(--ink)}
@media (max-width:470px){ .brand .sub{display:none} .icon-btn{padding:0 10px;font-size:.74rem} }

main{flex:1 1 auto;padding-bottom:28px;display:flex;flex-direction:column;gap:16px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);
  box-shadow:var(--shadow-sm);padding:16px}
.panel-title{font-size:.68rem;text-transform:uppercase;letter-spacing:.14em;font-weight:800;color:var(--ink-3);margin-bottom:12px}
.lede{font-family:"Fraunces",Georgia,serif;font-size:1.5rem;font-weight:600;line-height:1.2;margin-bottom:6px}
.lede em{font-style:normal;color:var(--accent)}
.lede-sub{color:var(--ink-2);font-size:.92rem;max-width:46ch}

.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:54px;padding:0 20px;
  border-radius:13px;background:var(--accent);color:var(--accent-ink);font-weight:800;font-size:1rem;box-shadow:var(--shadow-md)}
.btn:disabled{background:var(--line);color:var(--ink-3);box-shadow:none;cursor:not-allowed}
.btn-ghost{background:transparent;color:var(--ink-2);border:1px solid var(--line);box-shadow:none;min-height:46px;font-size:.88rem}
.btn-ghost:hover{color:var(--ink);border-color:var(--line-strong)}
.btn-row{display:flex;gap:8px;flex-wrap:wrap}
.btn-row>*{flex:1 1 150px;width:auto}

.field{display:flex;flex-direction:column;gap:6px;margin-bottom:12px}
.field label{font-size:.7rem;text-transform:uppercase;letter-spacing:.12em;font-weight:800;color:var(--ink-3)}
.field input{height:var(--tap);padding:0 14px;border-radius:11px;border:1px solid var(--line);
  background:var(--surface-2);font-weight:600;width:100%}
.field input:focus{background:var(--surface);border-color:var(--accent)}
input.code-input{font-size:1.6rem;font-weight:900;letter-spacing:.3em;text-align:center;height:62px;text-transform:uppercase}

.counter{display:flex;align-items:center;gap:14px}
.counter-val{font-size:2rem;font-weight:800;min-width:2ch;text-align:center}
.round-btn{width:var(--tap);height:var(--tap);border-radius:999px;flex:none;border:1px solid var(--line-strong);
  background:var(--surface-2);font-size:1.35rem;font-weight:700;line-height:1;display:grid;place-items:center}
.round-btn:disabled{opacity:.35;cursor:not-allowed}
.counter-note{color:var(--ink-2);font-size:.85rem;line-height:1.3}

/* ---- room code ---- */
.code-hero{text-align:center;padding:6px 0 2px}
.code-hero .kicker{font-size:.66rem;text-transform:uppercase;letter-spacing:.16em;font-weight:800;color:var(--ink-3)}
.code-hero .code{font-weight:900;font-size:clamp(2.8rem,17vw,4.6rem);letter-spacing:.14em;line-height:1.05;color:var(--accent)}
.code-hero .hint{color:var(--ink-2);font-size:.86rem;margin-top:2px}
.qr-wrap{display:flex;justify-content:center;margin:14px 0 4px}
.qr{width:min(220px,62vw);aspect-ratio:1;background:#fff;border-radius:12px;padding:10px;
  box-shadow:var(--shadow-sm);border:1px solid var(--line)}
.qr svg{display:block;width:100%;height:100%}

/* ---- scoreboard ---- */
.board{display:grid;gap:8px}
.tile{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);
  padding:10px 10px 8px;box-shadow:var(--shadow-sm);display:flex;flex-direction:column;align-items:center;gap:1px;overflow:hidden}
.tile.leader{border-color:var(--gold);background:linear-gradient(180deg,var(--gold-soft),var(--surface) 62%)}
.tile.you{outline:2px solid var(--accent);outline-offset:-2px}
.tile-name{font-size:.78rem;font-weight:700;color:var(--ink-2);max-width:100%;overflow:hidden;
  text-overflow:ellipsis;white-space:nowrap;display:flex;align-items:center;gap:4px}
.tile.leader .tile-name{color:var(--gold)}
.tile-name svg{width:12px;height:12px;flex:none}
.tile-score{font-weight:900;line-height:.95;letter-spacing:-.035em;font-size:var(--score-size)}
.tile-delta{font-size:.72rem;font-weight:800;padding:1px 7px;border-radius:999px;background:var(--surface-2);
  color:var(--ink-3);min-height:19px;display:flex;align-items:center}
.tile-delta.up{background:var(--good-soft);color:var(--good)}
.tile-delta.down{background:var(--bad-soft);color:var(--bad)}
.tile-delta.blank{opacity:0}
.tile-dealer{position:absolute;top:6px;right:6px;width:17px;height:17px;border-radius:5px;background:var(--accent);
  color:var(--accent-ink);font-size:.6rem;font-weight:900;display:grid;place-items:center}

/* ---- round ---- */
.round-head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.round-title{font-family:"Fraunces",Georgia,serif;font-size:1.55rem;font-weight:800;line-height:1;letter-spacing:-.01em}
.round-meta{font-size:.82rem;color:var(--ink-2);margin-top:4px}
.round-meta b{color:var(--ink);font-weight:700}
.trumps{display:flex;gap:6px;flex-wrap:wrap}
.trump{min-width:42px;height:38px;padding:0 10px;border-radius:10px;border:1px solid var(--line);
  background:var(--surface-2);font-size:1.05rem;font-weight:700;color:var(--ink-2);display:grid;place-items:center}
.trump[data-red="1"]{color:var(--heart)}
.trump[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.trump.none{font-size:.72rem;font-weight:800;letter-spacing:.06em;text-transform:uppercase}
.trump:disabled{opacity:.75;cursor:default}

.your-turn{border:1px solid var(--accent);background:linear-gradient(180deg,var(--accent-soft),var(--surface) 70%)}
.your-turn .panel-title{color:var(--accent)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{min-width:52px;height:52px;padding:0 8px;border-radius:12px;border:1px solid var(--line);
  background:var(--surface-2);font-size:1.15rem;font-weight:800;color:var(--ink-2);display:grid;place-items:center}
.chip:hover{border-color:var(--line-strong);color:var(--ink)}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);box-shadow:var(--shadow-sm)}
.chip[aria-pressed="true"].exact{background:var(--good);border-color:var(--good);color:#fff}
.chip:disabled{opacity:.45;cursor:not-allowed}
.chips.small .chip{min-width:44px;height:44px;font-size:1rem}

.roster{display:flex;flex-direction:column}
.roster-row{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.roster-row:first-child{border-top:0}
.seat-pip{flex:none;width:30px;height:30px;border-radius:9px;background:var(--accent-soft);color:var(--accent);
  font-size:.78rem;font-weight:800;display:grid;place-items:center}
.seat-pip.empty{background:var(--surface-2);color:var(--ink-3)}
.roster-name{flex:1 1 auto;min-width:0;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.roster-name.empty{color:var(--ink-3);font-weight:600;font-style:italic}
.roster-row input{flex:1 1 auto;min-width:0;height:44px;padding:0 12px;border-radius:10px;
  border:1px solid var(--line);background:var(--surface-2);font-weight:600}
.roster-row input:focus{background:var(--surface);border-color:var(--accent)}
.mini{flex:none;min-width:34px;height:34px;padding:0 8px;border-radius:9px;border:1px solid var(--line);
  background:var(--surface-2);color:var(--ink-2);font-size:.78rem;font-weight:800;display:grid;place-items:center}
.mini:hover:not(:disabled){border-color:var(--line-strong);color:var(--ink)}
.mini:disabled{opacity:.3;cursor:not-allowed}

.opts{display:flex;gap:6px;flex-wrap:wrap}
.opt{min-height:40px;padding:0 13px;border-radius:10px;border:1px solid var(--line);
  background:var(--surface-2);color:var(--ink-2);font-size:.84rem;font-weight:700}
.opt:hover:not(:disabled){border-color:var(--line-strong);color:var(--ink)}
.opt[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.opt:disabled{opacity:.75;cursor:default}
.opt-note{margin:8px 0 0;color:var(--ink-2);font-size:.84rem;line-height:1.45;max-width:52ch}
.opt-note b{color:var(--ink)}
.badge{font-size:.62rem;font-weight:900;letter-spacing:.08em;text-transform:uppercase;padding:3px 7px;
  border-radius:6px;background:var(--accent-soft);color:var(--accent);flex:none}
.badge.quiet{background:var(--surface-2);color:var(--ink-3)}
.badge.gold{background:var(--gold-soft);color:var(--gold)}
.badge.good{background:var(--good-soft);color:var(--good)}
.bid-chip{flex:none;min-width:34px;height:30px;border-radius:8px;display:grid;place-items:center;
  font-weight:900;font-size:.95rem;background:var(--surface-2);color:var(--ink-3)}
.bid-chip.in{background:var(--accent);color:var(--accent-ink)}

.entry{border-top:1px solid var(--line);padding:12px 0}
.entry:first-of-type{border-top:0;padding-top:0}
.entry-head{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.entry-name{font-weight:800;font-size:1rem;flex:1 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* The sticky bar overlays whatever is behind it once the page scrolls, so
   the content above needs room to end clear of it. */
.bar-spacer{flex:none;height:92px}
.actionbar{position:sticky;bottom:0;z-index:25;padding-top:10px;
  padding-bottom:calc(10px + env(safe-area-inset-bottom,0px));
  background:linear-gradient(transparent, var(--bg) 26%);display:flex;flex-direction:column;gap:7px}
.tally{display:flex;align-items:center;justify-content:center;gap:8px;font-size:.8rem;font-weight:700;color:var(--ink-2);text-align:center}
.tally .pill{padding:2px 9px;border-radius:999px;background:var(--surface);border:1px solid var(--line)}
.tally .pill.warn{background:var(--bad-soft);color:var(--bad);border-color:transparent}
.tally .pill.ok{background:var(--good-soft);color:var(--good);border-color:transparent}

.waiting{display:flex;align-items:center;gap:10px;color:var(--ink-2);font-size:.9rem;font-weight:600}
.dot{width:8px;height:8px;border-radius:999px;background:var(--accent);animation:pulse 1.4s ease-in-out infinite;flex:none}
@keyframes pulse{0%,100%{opacity:.25;transform:scale(.8)}50%{opacity:1;transform:scale(1.15)}}

details.history{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow-sm)}
details.history>summary{list-style:none;cursor:pointer;padding:14px 16px;display:flex;align-items:center;gap:8px;
  font-size:.7rem;text-transform:uppercase;letter-spacing:.14em;font-weight:800;color:var(--ink-3)}
details.history>summary::-webkit-details-marker{display:none}
details.history>summary::after{content:"\25BE";margin-left:auto;font-size:.85rem;transition:transform .2s}
details.history[open]>summary::after{transform:rotate(180deg)}
.scroll-x{overflow-x:auto;-webkit-overflow-scrolling:touch}
table.log{border-collapse:collapse;width:100%;font-size:.82rem;min-width:max-content}
table.log th,table.log td{padding:7px 10px;text-align:center;white-space:nowrap}
table.log thead th{font-size:.64rem;text-transform:uppercase;letter-spacing:.09em;color:var(--ink-3);
  font-weight:800;border-bottom:1px solid var(--line)}
table.log th.rnd,table.log td.rnd{text-align:left;position:sticky;left:0;background:var(--surface);z-index:1}
table.log tbody tr{border-bottom:1px solid var(--line)}
table.log tbody tr:last-child{border-bottom:0}
.cell-bid{color:var(--ink-3);font-weight:600}
.cell-delta{font-weight:800}
.cell-delta.up{color:var(--good)}
.cell-delta.down{color:var(--bad)}
.history-foot{padding:12px 16px;border-top:1px solid var(--line)}
.empty{padding:0 16px 16px;color:var(--ink-3);font-size:.85rem}

.winner{background:linear-gradient(160deg,var(--gold-soft),var(--surface) 70%);border:1px solid var(--gold)}
.winner .kicker{font-size:.66rem;text-transform:uppercase;letter-spacing:.16em;font-weight:800;color:var(--gold)}
.winner .who{font-family:"Fraunces",Georgia,serif;font-size:2rem;font-weight:800;line-height:1.1;margin:2px 0}
.winner .score-line{color:var(--ink-2);font-size:.9rem;font-weight:600}

.overlay{position:fixed;inset:0;z-index:100;background:var(--bg-deep);display:flex;flex-direction:column;
  padding:calc(16px + env(safe-area-inset-top,0px)) 16px calc(16px + env(safe-area-inset-bottom,0px));overflow-y:auto}
.overlay[hidden]{display:none}
.overlay-head{display:flex;align-items:center;gap:10px;margin-bottom:14px;flex:none}
.overlay-head h2{font-family:"Fraunces",Georgia,serif;font-size:1.1rem;font-weight:800;margin-right:auto}
.close-btn{width:40px;height:40px;border-radius:999px;border:1px solid var(--line);background:var(--surface);
  color:var(--ink-2);font-size:1.1rem;line-height:1;display:grid;place-items:center;flex:none}
.big-list{display:flex;flex-direction:column;gap:8px;flex:1 1 auto;justify-content:center}
.big-row{display:flex;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--line);
  border-radius:16px;padding:10px 16px}
.big-row.leader{border-color:var(--gold);background:linear-gradient(90deg,var(--gold-soft),var(--surface) 55%)}
.big-rank{font-size:.95rem;font-weight:900;color:var(--ink-3);width:1.4em;flex:none}
.big-row.leader .big-rank{color:var(--gold)}
.big-name{flex:1 1 auto;min-width:0;font-weight:800;font-size:clamp(1rem,4.4vw,1.5rem);
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.big-score{font-weight:900;letter-spacing:-.04em;line-height:.9;font-size:var(--big-size)}
.overlay-foot{flex:none;padding-top:14px;text-align:center;color:var(--ink-3);font-size:.8rem;font-weight:600}
.prose{max-width:60ch;color:var(--ink-2);font-size:.92rem}
.prose h3{font-family:"Fraunces",Georgia,serif;font-size:1.05rem;font-weight:800;color:var(--ink);margin:18px 0 6px}
.prose h3:first-child{margin-top:0}
.prose p,.prose ul{margin:0 0 8px}
.prose ul{padding-left:18px}
.prose li{margin-bottom:4px}
.prose b{color:var(--ink)}
.rule-eq{display:inline-block;background:var(--surface);border:1px solid var(--line);border-radius:8px;
  padding:2px 8px;font-weight:700;color:var(--ink)}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(18px + env(safe-area-inset-bottom,0px));
  z-index:200;background:var(--bad);color:#fff;font-weight:700;font-size:.86rem;padding:10px 16px;
  border-radius:999px;box-shadow:var(--shadow-md);max-width:calc(100% - 32px);text-align:center}
.toast[hidden]{display:none}
.conn{font-size:.68rem;font-weight:800;text-transform:uppercase;letter-spacing:.1em;color:var(--ink-3);
  display:flex;align-items:center;gap:6px;justify-content:center;padding-top:2px}
.conn .led{width:7px;height:7px;border-radius:999px;background:var(--good)}
.conn.stale .led{background:var(--bad)}
.flash{animation:flash .5s ease-out}
@keyframes flash{0%{transform:scale(1)}35%{transform:scale(1.08)}100%{transform:scale(1)}}
@media (prefers-reduced-motion: reduce){ *{animation-duration:.001ms !important;transition-duration:.001ms !important} }
</style>
</head>
<body>
<div class="app">
  <header class="topbar">
    <div class="brand">
      <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 1.6 13.9 8l6.4 1.4-4.6 4.2 1 6.5-5.1-3-5.1 3 1-6.5L3 9.4 9.4 8 12 1.6Z"/></svg>
      <h1>Wizard</h1><span class="sub">Scorekeeper</span>
    </div>
    <div class="topbar-actions" id="topbar-actions"></div>
  </header>
  <main id="main"></main>
</div>
<div class="overlay" id="overlay-table" hidden></div>
<div class="overlay" id="overlay-rules" hidden></div>
<div class="toast" id="toast" hidden></div>

<script type="module" src="app.js"></script>
</body>
</html>
