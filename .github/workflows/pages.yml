name: Pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      # The logic, QR and adapter suites are dependency-free, but the blob
      # suite checks @vercel/blob's own type definitions to catch the store
      # asking for options the installed SDK does not have -- which is how a
      # version slip silently disabled compare-and-swap in production. That
      # check is only worth anything if the package is actually here, so CI
      # installs it. Runtime is unaffected: `node server.js` still needs
      # nothing installed. Dev dependencies are skipped; the browser tests
      # need Playwright and are run locally.
      - run: npm ci --omit=dev
      - run: npm test

  deploy:
    needs: test
    # Pull requests are tested but never published; only main reaches the site.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      # public/ is the whole static site: the client, the QR encoder and the
      # game logic it runs in the browser when there's no server.
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - id: deployment
        uses: actions/deploy-pages@v4
